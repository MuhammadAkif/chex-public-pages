<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Auth Bridge</title>
  </head>
  <body>
    <script>
      (function () {
        // Dev origins are appended only when this file is served from a non-prod host,
        // so the prod chex.ai bridge will only ever respond to https://app.chex.ai.
        var ALLOWED_ORIGINS = ['https://app.chex.ai'];
        if (
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1'
        ) {
          ALLOWED_ORIGINS.push('http://localhost:3001', 'http://127.0.0.1:3001');
        }
        var SHARED_KEYS = [
          'jwt',
          'token',
          'currentUser_email',
          'currentUser_id',
          'currentUser_name',
          'currentUser',
          'recommendScreen',
          'doAndDont',
          'vehicleData'
        ];

        function isAllowedOrigin(origin) {
          for (var i = 0; i < ALLOWED_ORIGINS.length; i++) {
            if (ALLOWED_ORIGINS[i] === origin) return true;
          }
          return false;
        }

        function readSharedStorage() {
          var out = {};
          for (var i = 0; i < SHARED_KEYS.length; i++) {
            var key = SHARED_KEYS[i];
            try {
              out[key] = window.localStorage.getItem(key);
            } catch (e) {
              out[key] = null;
            }
          }
          return out;
        }

        function onMessage(event) {
          if (!isAllowedOrigin(event.origin)) return;

          var data = event.data;
          if (!data || typeof data !== 'object') return;
          if (data.type !== 'GET_TOKEN') return;

          var storage = readSharedStorage();

          var source = event.source;
          if (!source) return;

          source.postMessage(
            {
              type: 'TOKEN_RESPONSE',
              token: storage.jwt || storage.token,
              storage: storage
            },
            event.origin
          );
        }

        window.addEventListener('message', onMessage, false);
      })();
    </script>
  </body>
</html>
